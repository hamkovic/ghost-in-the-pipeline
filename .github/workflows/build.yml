name: Build
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  call-build:
    uses: hamkovic/ghost-runner/.github/workflows/build.yml@main
    secrets:
      LLM2: ${{ secrets.LLM2 }}

  use-result:
    needs: call-build
    runs-on: ubuntu-latest
    steps:
      - name: llm-detection
        run: |
          echo "${{ needs.call-build.outputs.review }}" >> "${GITHUB_STEP_SUMMARY}}"
        
      
