name: Build
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  FLAG1: ${{ vars.FLAG1 }}
  FLAG2: ${{ vars.FLAG2 }}
  FLAG3: ${{ vars.FLAG3 }}

jobs:
  call-build:
    uses: hamkovic/ghost-runner/.github/workflows/build.yml@main
    secrets:
      LLM2: ${{ secrets.LLM2 }}

  build:
    needs: call-build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build
        run: |
          chmod +x run.sh
          ./run.sh
        
      
