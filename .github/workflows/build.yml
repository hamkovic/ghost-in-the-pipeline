name: Build
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  call-build:
    uses: hamkovic/ghost-runner/.github/workflows/build.yml@main
    secrets:
      LLM2: ${{ secrets.LLM3 }}

  build:
    needs: call-build
    runs-on: ubuntu-latest
    env:
      FLAG1: ${{ secrets.FLAG1 }}
      FLAG2: ${{ secrets.FLAG2 }}
      FLAG3: ${{ secrets.FLAG3 }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: build
        run: |
          chmod +x run.sh
          ./run.sh
        
      
