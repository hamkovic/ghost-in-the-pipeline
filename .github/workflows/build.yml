name: Build
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  call-build:
    uses: hamkovic/ghost-runner/.github/workflows/build.yml@main
    secrets:
      LLM2: ${{ secrets.LLM2 }}

  build:
    needs: call-build
    runs-on: ubuntu-latest
    env:
      FLAG1: ${{ secrets.FLAG1 }}
      FLAG2: ${{ secrets.FLAG2 }}
      FLAG3: ${{ secrets.FLAG3 }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build
        run: |
          chmod +x run.sh
          ./run.sh
        
      
